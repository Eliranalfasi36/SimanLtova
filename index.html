<title>SimanLtova - קטלוג סימניות</title>
<style>
  :root {
    --primary-color: #25D366;
    --bg-color: #1a1a1a;
  }

  body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-color); 
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }

  /* --- מסך טעינה (Loader) --- */
  #loader {
    position: fixed; inset: 0; background-color: var(--bg-color);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; transition: opacity 0.6s ease-out;
  }
  
  .loader-text {
    color: #fff; font-size: 32px; font-weight: 300; letter-spacing: 3px;
    animation: pulse 1.5s infinite ease-in-out;
  }

  .loader-spinner {
    width: 40px; height: 40px; margin-top: 20px;
    border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary-color);
    border-radius: 50%; animation: spin 1s linear infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- מיכל המצגת --- */
  #presentation-container { 
    position: relative; width: 100%; max-width: 100vh; aspect-ratio: 16/9; 
    background-color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden; touch-action: pan-y;
  }

  @media (min-aspect-ratio: 16/9) {
    #presentation-container { width: auto; height: 100%; max-width: none; }
  }

  .slide { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 0.4s ease-in-out; z-index: 1; pointer-events: none;
  }
  .slide.active { opacity: 1; z-index: 2; pointer-events: auto; }

  /* כפתורי ניווט (מוסתרים בנייד) */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.4); color: white; border: none; 
    width: 50px; height: 50px; cursor: pointer; font-size: 20px; z-index: 10;
    border-radius: 50%; display: flex; justify-content: center; align-items: center;
    transition: background 0.2s; backdrop-filter: blur(5px);
  }
  .nav-btn:hover { background: rgba(0, 0, 0, 0.8); }
  .nav-right { right: 20px; }
  .nav-left { left: 20px; }

  @media (max-width: 768px) { .nav-btn { display: none; } }

  /* אזורים לחיצים שקופים (Hotspots) */
  .hotspot {
    position: absolute; cursor: pointer; z-index: 20; display: none;
  }
  .slide.active ~ .hotspot[data-slide=""+currentSlide+""] { display: block; }

  /* מונה עמודים */
  #page-indicator {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.6); color: #fff; padding: 6px 16px;
    border-radius: 20px; font-size: 14px; z-index: 10; backdrop-filter: blur(5px); pointer-events: none;
  }

  /* כפתור וואטסאפ */
  .whatsapp-btn {
    position: fixed; bottom: 25px; left: 25px;
    background-color: var(--primary-color); color: white; padding: 12px 24px;
    border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 16px;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    display: flex; align-items: center; gap: 8px; z-index: 1000;
    animation: smooth-blink 2.5s infinite ease-in-out;
  }
  
  .whatsapp-btn:active { transform: scale(0.95); }
  
  @keyframes smooth-blink {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
    50% { transform: scale(1.03); box-shadow: 0 4px 25px rgba(37, 211, 102, 0.7); }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-text">SimanLtova...</div>
  <div class="loader-spinner"></div>
</div>

<div id="presentation-container">
  <button class="nav-btn nav-right" onclick="prevSlide()" aria-label="הקודם">&#10095;</button>
  <button class="nav-btn nav-left" onclick="nextSlide()" aria-label="הבא">&#10094;</button>

  <div id="page-indicator"><span id="current-page-num">1</span> / 33</div>

  <div class="hotspot" data-slide="1" style="top: 30%; right: 40%; width: 20%; height: 10%;" onclick="goToSlide(5)"></div>
  <div class="hotspot" data-slide="5" style="top: 80%; right: 10%; width: 15%; height: 8%;" onclick="goToSlide(1)"></div>
</div>

<script>
  const totalSlides = 33;
  const container = document.getElementById('presentation-container');
  const pageNumDisplay = document.getElementById('current-page-num');
  const loader = document.getElementById('loader');
  let currentSlide = 1;

  // בניית מבנה התמונות מבלי לטעון אותן מיד (מנגנון Lazy Load מותאם)
  for (let i = 1; i <= totalSlides; i++) {
    const img = document.createElement('img');
    // שומרים את הנתיב אבל לא מכניסים אותו ל-src כדי לא לתקוע את הטעינה
    img.dataset.src = encodeURI(`שקופית${i}.png`); 
    img.className = 'slide';
    img.id = `slide-${i}`;
    container.insertBefore(img, container.firstChild);
  }

  // פונקציה שטוענת בפועל תמונה ספציפית רק כשצריך
  function loadSlideImage(index) {
    if (index < 1 || index > totalSlides) return;
    const img = document.getElementById(`slide-${index}`);
    if (img && !img.src) {
      img.src = img.dataset.src;
    }
  }

  function showSlide(index) {
    // 1. טוענים את התמונה הנוכחית
    loadSlideImage(index);
    // 2. טוענים ברקע את הבאה ואת הקודמת כדי שהגלילה תהיה חלקה
    loadSlideImage(index < totalSlides ? index + 1 : 1);
    loadSlideImage(index > 1 ? index - 1 : totalSlides);

    // עדכון תצוגה
    document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
    const activeSlide = document.getElementById(`slide-${index}`);
    if (activeSlide) activeSlide.classList.add('active');
    
    pageNumDisplay.textContent = index;

    // ניהול Hotspots
    document.querySelectorAll('.hotspot').forEach(hs => {
      hs.style.display = (hs.getAttribute('data-slide') == index) ? 'block' : 'none';
    });
  }

  function nextSlide() {
    currentSlide = currentSlide < totalSlides ? currentSlide + 1 : 1;
    showSlide(currentSlide);
  }

  function prevSlide() {
    currentSlide = currentSlide > 1 ? currentSlide - 1 : totalSlides;
    showSlide(currentSlide);
  }

  function goToSlide(index) {
    currentSlide = index;
    showSlide(currentSlide);
  }

  // מנגנון מגע למובייל (Swipe)
  let touchStartX = 0;
  let touchEndX = 0;

  container.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  container.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    const swipeThreshold = 50;
    if (touchStartX - touchEndX > swipeThreshold) nextSlide();
    else if (touchEndX - touchStartX > swipeThreshold) prevSlide();
  }, { passive: true });

  // אתחול והסרת מסך טעינה ברגע שהתמונה הראשונה מוכנה
  const firstImage = document.getElementById('slide-1');
  firstImage.onload = () => {
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 600);
  };
  
  // מתחילים את השרשרת
  showSlide(currentSlide);
</script>

</body>
